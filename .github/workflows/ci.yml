name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore DProjects.Libs.sln

      - name: Build
        run: >
          dotnet build DProjects.Libs.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test DProjects.Libs.sln
          --configuration Release
          --no-build
          --filter "Category!=Integration"
          --ignore-exit-code 8

      - name: Pack
        run: >
          dotnet pack DProjects.Libs.sln
          --configuration Release
          --no-build
          --output artifacts/packages