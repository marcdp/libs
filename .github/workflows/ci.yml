name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dprojects_ci
          POSTGRES_USER: dprojects_ci
          POSTGRES_PASSWORD: dprojects_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dprojects_ci -d dprojects_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore DProjects.Libs.sln

      - name: Build
        run: >
          dotnet build DProjects.Libs.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test --solution DProjects.Libs.sln
          --configuration Release
          --no-build
          --no-restore
          --
          --filter-not-trait "Category=Integration"
          --ignore-exit-code 8

      - name: PostgreSQL schema-discovery provider contract
        env:
          DPROJECTS_POSTGRESQL_CI: Host=localhost;Port=5432;Database=dprojects_ci;Username=dprojects_ci;Password=dprojects_ci
        run: >
          dotnet test --project test/DProjects.Db.Postgresql.Test/DProjects.Db.Postgresql.Test.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          --filter-trait "Category=CIProviderContract"

      - name: Pack
        run: >
          dotnet pack DProjects.Libs.sln
          --configuration Release
          --no-build
          --output artifacts/packages
